# Per-pipeline-step model routing (SPEC §9, CLAUDE.md "Model / cost rules").
#
# Nothing secret lives here. API keys are read from .env via `api_key_env`.
#
# status: active   -> callable now.
# status: planned  -> reserved. resolve_step() raises a clear error. Flip to
#                     active in the slice that implements it; that is the only
#                     change needed, no code edit.
#
# Provider + model are configured HERE, never hardcoded in a call site. A step
# omits a field to inherit it from `defaults`.
version: 1

providers:
  zai:
    kind: api
    base_url: https://api.z.ai/api/paas/v4
    api_key_env: ZAI_API_KEY
    timeout_s: 60
    max_retries: 2
  deepseek:
    kind: api
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    timeout_s: 60
    max_retries: 2
  local:
    kind: local # in-process sentence-transformers. ADR-004: never an API.

# USD per 1M tokens. ONLY models with a KNOWN rate are listed. A model absent
# here is "unpriced": its tokens are still logged from the API response, but cost
# is recorded as null and warned once -- never a guessed dollar figure that
# silently goes stale. Add a real rate here the day you enable a paid model.
#
# Rates are CHECKED, not remembered (ADR-008 §4). The glm-4.6 line below was read
# off https://docs.z.ai/guides/overview/pricing on 2026-07-31. Worth recording
# why that matters: a web search for the same figures returned $0.43/$1.75 from a
# third-party aggregator, which is simply wrong. Re-check against z.ai's own docs
# before trusting these, and update the date when you do.
pricing:
  zai:
    glm-4.5-flash: { input: 0.0, cached_input: 0.0, output: 0.0 }
    # Checked 2026-07-31, docs.z.ai. "Cached input storage" is listed as
    # limited-time free, so only the cached-token read rate is modelled here.
    glm-4.6: { input: 0.60, cached_input: 0.11, output: 2.20 }
    # --- Vision (slice 8). All checked 2026-08-03, docs.z.ai. ---
    #
    # In use: free, and explicitly zero-priced so it reports as KNOWN-free rather than
    # unpriced. Same distinction the local embedder entry below spells out.
    glm-4.6v-flash: { input: 0.0, cached_input: 0.0, output: 0.0 }
    #
    # The paid upgrade path, recorded here so switching is a one-line edit with a rate
    # already verified -- never a guess (ADR-008 §4):
    #   glm-4.6v   $0.30 in / $0.90 out   <- take this if free-flash OCR proves inadequate
    #   glm-ocr    $0.03 in / $0.03 out   <- purpose-built for OCR; cheaper still
    #
    # NOT glm-4.5v, which slice 2 reserved before any of these existed: it is superseded
    # and costs $0.60/$1.80 -- twice the current paid model for an older one. Left
    # unlisted deliberately, so routing to it would report unpriced and warn.
  # Local embeddings are free, but "free" and "unknown" must stay distinguishable:
  # without an entry they would report as unpriced, as if the rate were merely
  # untracked. An explicit zero says known-free.
  local:
    intfloat/multilingual-e5-small: { input: 0.0, output: 0.0 }

defaults:
  provider: zai
  model: glm-4.5-flash
  temperature: 0.0
  max_tokens: 4096

# NOTE on max_tokens: GLM-4.5 models reason before answering, and those internal
# reasoning tokens count toward max_tokens. A cap that is too tight returns
# finish_reason: "length" with EMPTY content -- the budget ran out mid-thought.
# Budget for reasoning plus the answer, and treat finish_reason: "length" as a
# failed call rather than an empty result.
steps:
  extraction: # SPEC §2, §9 -- candidate concepts from a source. Slice 3.
    status: active
    model: glm-4.5-flash
    max_tokens: 4096

  adjudication: # SPEC §3.1 tier 3 + §4.1/§4.2 -- the four outcomes + merge. Slice 5.
    # Active since slice 5. Serves BOTH adjudication calls -- the four-outcome
    # classification and the merge regeneration. They are different prompts, so
    # they share no cache entry (the key covers the request, not the step:
    # ADR-008 §1); splitting them into two steps later is a config edit, not a
    # code change, which is exactly what per-step routing buys.
    #
    # Switched from glm-4.5-flash to glm-4.6 on 2026-07-31, with its real price
    # added above at the same moment (ADR-011 §5).
    #
    # Slice 5 was TUNED on flash because it is free and tuning is the
    # token-hungriest phase. That was never meant to be the production model, and
    # the measured addendum to ADR-011 §5 is why: flash got BOTH real gray-zone
    # pairs wrong -- DISTINCT where the answer is `governs`, and `same_family`
    # where SPEC §4.2 requires a shared stem and there is none. Confident,
    # well-phrased, and wrong in a way a skimming reviewer waves through. For a
    # typed-edge system that is wrong pedagogy, so this switch is a correctness
    # requirement, not a cost trade.
    #
    # The model name is in the cache key (ADR-008 §1), so this edit re-adjudicates
    # every pair on 4.6 rather than serving flash's verdicts from cache -- exactly
    # what is wanted: one paid pass after free tuning. Every decision record in
    # logs/decisions.jsonl stores the deciding provider+model, so any verdict
    # already taken on flash stays a grep.
    status: active
    model: glm-4.6
    # 2048 was the planned value and is too tight. A regenerated node body is
    # itself ~1-2k tokens, and GLM spends completion tokens on reasoning FIRST
    # (see the NOTE above) -- so a merge call would return finish_reason:
    # "length" with empty content. Matched to extraction's budget.
    max_tokens: 4096
    fallback: { provider: deepseek, model: deepseek-chat }

  cefr_tiebreak: # SPEC §5 signal 3 -- the LAST resort, not the default. Slice 6.
    # CEFR is rules-first: the grammar map (§5 signal 2) and the wordlist (signal 1) are
    # pure lookups and cost nothing. This step fires ONLY when those two conflict or are
    # both silent, and the prompt is handed their results rather than asked cold -- §5 is
    # explicit that a zero-shot CEFR judgment is inconsistent across sessions.
    #
    # Deliberately glm-4.5-flash and NOT the adjudication step's glm-4.6. Adjudication is
    # a per-pair judgment worth paying for; a tiebreak can fire on every node that lacks a
    # grammar match, so it must stay free. It is also the least-grounded signal in the
    # system, which is a reason to spend less on it, not more.
    #
    # Until vocab/cefr/ holds a real wordlist, pure-vocabulary nodes have no lexical
    # anchor and no grammar structure, so they all land here. Those levels are findable
    # with `grep -l 'cefr_basis: llm:tiebreak' nodes/` -- the successor to slice 3's
    # `llm:extraction` grep habit (ADR-009), and the reason the marker stays greppable.
    status: active
    model: glm-4.5-flash
    max_tokens: 2048
    fallback: { provider: deepseek, model: deepseek-chat }

  transparency: # SPEC §7.4 -- is this word family a scaffold or a coincidence? Slice 7.
    # The ONE judgment in slice 7 that rules cannot make. Segmentation is mechanical
    # (a closed prefix inventory plus corpus evidence), but whether `verstehen` really
    # belongs to `stehen` is semantic: SPEC §7.4 says those meanings "have drifted
    # centuries past transparency", and no rule sees that.
    #
    # Free glm-4.5-flash, same reasoning as cefr_tiebreak above and NOT the paid glm-4.6:
    # this is a per-candidate call that fires as verbs arrive, and a wrong answer marks a
    # grid cell rather than corrupting a node body. Two things backstop it -- the review
    # gate (family_transparency is written to /nodes, so ADR-003 applies) and §7.4's own
    # rule that "the node holds the truth; the grid only predicts a guess".
    #
    # Small budget on purpose: the answer is one enum value and one sentence.
    status: active
    model: glm-4.5-flash
    max_tokens: 1024
    fallback: { provider: deepseek, model: deepseek-chat }

  vision: # SPEC §9 -- image/PDF OCR. Slice 8.
    # Active since slice 8, on the FREE glm-4.6v-flash. Same pattern extraction and
    # adjudication both follow: tune on free, upgrade only if quality proves inadequate
    # on real material -- a decision made after watching it run, not before.
    #
    # NOT glm-4.5v, which slice 2 reserved. That entry went stale: 4.5v is superseded and
    # costs $0.60/$1.80, twice the current paid model for an older one. Config written a
    # slice ahead is reviewed and visible (ADR-008 §2) but not automatically still right
    # when its slice finally lands -- re-check the model, not just the price.
    #
    # The upgrade path, if free-flash OCR mangles real German scans: glm-4.6v at
    # $0.30/$0.90, priced in the table above so the switch is one line. Judge it on
    # umlauts and ß specifically -- that is where OCR fails in ways that survive a glance
    # (Bäckerei -> Backerei), and the OCR checkpoint exists to catch exactly that.
    #
    # Vision runs per SOURCE rather than per decision, so the cache matters more here
    # than anywhere since slice 2 -- and it will matter for money the day this goes paid.
    # An image is keyed by sha256 of its bytes (ADR-015): re-ingesting the same scan is
    # free, and two different scans can never collide onto one transcription.
    #
    # max_tokens is generous because the answer is a full page of German prose, and a
    # truncated transcription is the dangerous failure: it reads as complete OCR.
    # _vision.parse treats finish_reason == "length" as a failed call for that reason.
    status: active
    model: glm-4.6v-flash
    max_tokens: 8192
    fallback: { provider: deepseek, model: deepseek-chat }

  embeddings: # SPEC §9 + ADR-004 -- ALWAYS local, never an API. Slice 4.
    # Active since slice 4, together with the `local` pricing entry above.
    # complete() still refuses this step: kind=local can never be an HTTP call,
    # checked independently of status. The local runner lives in german_wiki.embed.
    #
    # The vector WIDTH is not configured here -- db.EMBEDDING_DIM pins it, because
    # the vec0 column needs it at CREATE time. Changing this model means changing
    # that constant and running `gw reindex && gw embed`.
    status: active
    provider: local
    model: intfloat/multilingual-e5-small
