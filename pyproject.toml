[project]
name = "german-wiki"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.4",
    "python-frontmatter==1.3.0",
    "pyyaml==6.0.3",
    "openai==2.45.0",              # OpenAI-compatible client for GLM/DeepSeek
    "sentence-transformers==5.6.0",
    "sqlite-vec==0.1.9",
    "typer==0.26.8",
    "rich==15.0.0",
    "python-dotenv==1.2.2",
    "langgraph==1.2.9",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[project.scripts]
gw = "german_wiki.cli:app"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: hits a real model API; needs GW_LIVE_TESTS=1 and an API key"]